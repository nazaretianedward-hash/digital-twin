<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой двойник компании</title>
<meta name="description" content="Цифровой двойник компании: АУРА, Алхимик, O1L, Ассистент закупщика.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EAF3FD">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/img/bg.2e6c6f4a54.webp" as="image" type="image/webp">
<link rel="preload" href="assets/img/map.3b011f9f1c.webp" as="image" type="image/webp">
<link rel="preload" href="assets/fonts/gpn-dinc-700.e7e1187706.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/gpn-din-400.e36e4fe3dd.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.25e3bb6688.css">
</head>
<body>
<div class="bg" aria-hidden="true"><img id="bgImg" alt=""></div>

<div class="page">
  <header class="title">
    <h1>Цифровой двойник <span>компании</span></h1>
    <p id="sub">Выберите продукт — он откроется в новой вкладке</p>
  </header>

  <div class="stage" aria-hidden="true">
    <div class="scene" id="scene">
      <img class="map" id="mapImg" alt="">
      <div class="obj obj-left" data-part="left">
        <img class="glow" alt=""><img class="base" alt="">
      </div>
      <div class="obj obj-right" data-part="right">
        <img class="glow" alt=""><img class="base" alt="">
      </div>
    </div>
  </div>

  <main class="list" id="grid"></main>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Видео о продукте" hidden>
  <video id="playerVideo" playsinline preload="auto"></video>
  <div class="player-bar">
    <span class="player-title" id="playerTitle"></span>
    <div class="player-btns">
      <button class="pbtn" type="button" id="playerClose" aria-label="Закрыть видео">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l10 10M14 4L4 14"/></svg><span>Закрыть</span>
      </button>
      <a class="pbtn primary" id="playerSkip" href="#" target="_blank" rel="noopener">
        <span>Пропустить</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>
    </div>
  </div>
  <div class="player-end" id="playerEnd">
    <a class="end-btn" id="playerEndLink" href="#" target="_blank" rel="noopener">
      <span id="playerEndText">Открыть продукт</span><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
  </div>
  <div class="player-progress"><i id="playerProgress"></i></div>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <div class="dlg-head"><h3>Ссылки на продукты</h3>
      <button class="x" value="cancel" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.5"><path d="M4 4l10 10M14 4L4 14"/></svg></button></div>
    <p class="dlg-sub">Адреса сохраняются в этом браузере. Пустое поле — вместо перехода появится подсказка.</p>
    <div class="dlg-body" id="settingsBody"></div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="resetLinks">Вернуть исходные</button>
      <div style="display:flex;gap:10px"><button class="btn" value="cancel">Отмена</button><button class="btn primary" value="save">Сохранить</button></div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="position:fixed;left:24px;bottom:24px;color:#0B2257;font:16px Arial">Для работы страницы включите JavaScript.</p></noscript>
<script src="config.js?v=4" defer></script>
<script src="assets/js/app.e467a54e21.js" defer></script>
</body>
</html>
