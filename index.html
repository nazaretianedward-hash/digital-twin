<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой двойник компании</title>
<meta name="description" content="Цифровой двойник компании: АУРА, O1L, Алхимик, ГПНAI.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06173F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/img/bg.0551b24ddb.webp" as="image" type="image/webp">
<link rel="preload" href="assets/fonts/gpn-dinc-700.3c681e337a.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/gpn-din-400.92b21cec6b.woff2" as="font" type="font/woff2" crossorigin>

<body>
<div class="bg" aria-hidden="true"><img id="bgImg" alt=""></div>

<div class="page">
  <header class="title">
    <h1><span class="l1">Цифровой двойник</span><br><span>компании</span></h1>
    <p id="sub">Выберите продукт — он откроется в новой вкладке</p>
  </header>
  <main class="grid" id="grid"></main>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <div class="dlg-head"><h3>Ссылки на продукты</h3>
      <button class="x" value="cancel" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="1.5"><path d="M4 4l10 10M14 4L4 14"/></svg></button></div>
    <p class="dlg-sub">Адреса сохраняются в этом браузере. Пустое поле — вместо перехода появится подсказка.</p>
    <div class="dlg-body" id="settingsBody"></div>
    <div class="dlg-foot">
      <button class="btn" type="button" id="resetLinks">Вернуть исходные</button>
      <div style="display:flex;gap:10px"><button class="btn" value="cancel">Отмена</button><button class="btn primary" value="save">Сохранить</button></div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="position:fixed;left:24px;bottom:24px;color:#fff;font:16px Arial">Для работы страницы включите JavaScript.</p></noscript>
<script src="config.js" defer></script>
<script src="assets/js/app.0667fd1658.js" defer></script>
</body>
</html>
